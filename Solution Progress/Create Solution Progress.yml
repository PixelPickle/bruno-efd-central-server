info:
  name: Create Solution Progress
  type: http
  seq: 1

http:
  method: POST
  url: "{{rootUrl}}/escapeFriendsDayCentral/api/solutionProgress"
  body:
    type: json
    data: |-
      {
        "solutionLibraryId": "2",
        "gameId": "1",
        "isComplete": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
