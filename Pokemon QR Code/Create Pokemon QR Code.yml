info:
  name: Create Pokemon QR Code
  type: http
  seq: 1

http:
  method: POST
  url: "{{rootUrl}}/escapeFriendsDayCentral/api/pokemonQrCode"
  body:
    type: json
    data: |-
      {
        "nationalDexNumber": 1025,
        "roomId": "1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
