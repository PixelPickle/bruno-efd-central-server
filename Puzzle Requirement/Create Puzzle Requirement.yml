info:
  name: Create Puzzle Requirement
  type: http
  seq: 1

http:
  method: POST
  url: "{{rootUrl}}/escapeFriendsDayCentral/api/puzzleRequirement"
  body:
    type: json
    data: |-
      {
        "puzzleLibraryId": "2",
        "solutionLibraryId": "2",
        "name": "Solve This Puzzle"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
